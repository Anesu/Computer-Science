name: Link check

# Churn defense (planning/07, S9): weekly sweep of every registry URL.
# A red run means a source has rotted — fix the URL or the registry entry.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays ~06:17 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check_links.py
