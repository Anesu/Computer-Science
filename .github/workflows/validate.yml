name: Validate curriculum
on:
  push:
    paths: ["curriculum/**", "resources/**", "scripts/**", "site/**",
            "schemas/**", "templates/**", "samples/**", ".claude/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/validate_pathway.py
      - name: Record schema fixtures behave
        run: |
          python3 scripts/validate_pathway.py --record templates/progress.yaml
          python3 scripts/validate_pathway.py --record samples/learner-record/progress.yaml
          for f in samples/record-fixtures/invalid-*.yaml; do
            if python3 scripts/validate_pathway.py --record "$f"; then
              echo "expected $f to fail validation"; exit 1
            fi
          done
      - name: Pathway graph is up to date
        run: |
          python3 scripts/validate_pathway.py --graph
          git diff --exit-code -- planning/pathway.tldr planning/04-pathway-graph.md
      - name: Site docs are up to date
        run: |
          python3 scripts/build_site_docs.py
          git diff --exit-code -- site/docs site/public site/lib

  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: site
      - run: npx blume build --strict
        working-directory: site
