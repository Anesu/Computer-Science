name: Validate curriculum
on:
  push:
    paths: ["curriculum/**", "resources/**", "scripts/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/validate_pathway.py
      - name: Pathway graph is up to date
        run: |
          python3 scripts/validate_pathway.py --mermaid > planning/04-pathway-graph.md
          git diff --exit-code -- planning/04-pathway-graph.md
