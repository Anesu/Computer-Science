  - id: CS4902
    title: Capstone II
    semester: 8
    credits: 5
    track: core
    knowledge_areas: [SE, SEP]
    prerequisites: [CS4901]

  # ── Track: AI / Machine Learning ────────────────────────────────────
  - id: AI-DL
    title: Deep Learning
    semester: 6
    credits: 3
    track: ai
    knowledge_areas: [AI]
    prerequisites: [CS3102]

  - id: AI-NLP
    title: NLP & Large Language Models
    semester: 7
    credits: 3
    track: ai
    knowledge_areas: [AI]
    prerequisites: [AI-DL]

  - id: AI-RL
    title: Reinforcement Learning
    semester: 7
    credits: 3
    track: ai
    knowledge_areas: [AI]
    prerequisites: [CS3102, MA2101]

  - id: AI-MLOPS
    title: MLOps & Production ML
    semester: 7
    credits: 3
    track: ai
    knowledge_areas: [AI, SE, SPD]
    prerequisites: [CS3102, CS3203]

  - id: AI-SAFE
    title: AI Safety & Alignment
    semester: 7
    credits: 3
    track: ai
