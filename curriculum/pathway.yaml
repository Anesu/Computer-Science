# Machine-readable programme pathway — single source of truth for the DAG.
# Validated by scripts/validate_pathway.py (CI). Human rendering:
# planning/02-programme-structure.md
#
# semester = earliest availability under full-time pacing (tracks/electives use
# their earliest sensible slot). knowledge_areas use CS2023 KA codes.

programme:
  id: OPEN-CS-2026
  title: Open CS Degree 2026
  target_credits: 120

knowledge_areas:
  AI: Artificial Intelligence
  AL: Algorithmic Foundations
  AR: Architecture and Organization
  DM: Data Management
  FPL: Foundations of Programming Languages
  GIT: Graphics and Interactive Techniques
  HCI: Human-Computer Interaction
  MSF: Mathematical and Statistical Foundations
  NC: Networking and Communication
  OS: Operating Systems
  PDC: Parallel and Distributed Computing
  SDF: Software Development Fundamentals
  SE: Software Engineering
  SEC: Security
  SEP: Society, Ethics and the Profession
  SF: Systems Fundamentals
  SPD: Specialized Platform Development

courses:
  # ── Year 1 ──────────────────────────────────────────────────────────
  - id: CS1101
    title: Programming Fundamentals
    semester: 1
    credits: 4
    track: core
    knowledge_areas: [SDF, SEP]
    prerequisites: []

  - id: MA1101
    title: Discrete Mathematics
    semester: 1
    credits: 4
    track: core
    knowledge_areas: [MSF]
    prerequisites: []

  - id: CS1102
    title: Computer Systems Fundamentals
    semester: 1
    credits: 4
    track: core
    knowledge_areas: [SF, AR]
    prerequisites: []

  - id: MA1102
    title: Calculus for Computing
    semester: 1
    credits: 3
    track: core
    knowledge_areas: [MSF]
    prerequisites: []

  - id: CS1201
    title: Data Structures & Algorithms I
    semester: 2
    credits: 4
    track: core
    knowledge_areas: [AL, SDF]
    prerequisites: [CS1101, MA1101]

  - id: CS1202
    title: Systems Programming
    semester: 2
    credits: 4
    track: core
    knowledge_areas: [SF, SDF, FPL]
    prerequisites: [CS1101, CS1102]

  - id: MA1201
    title: Linear Algebra
    semester: 2
    credits: 3
    track: core
    knowledge_areas: [MSF]
    prerequisites: [MA1102]

  - id: CS1203
    title: Software Construction & Tooling
    semester: 2
    credits: 4
    track: core
    knowledge_areas: [SDF, SE, SPD]
    prerequisites: [CS1101]

  # ── Year 2 ──────────────────────────────────────────────────────────
  - id: CS2101
    title: Algorithm Design & Analysis
    semester: 3
    credits: 4
    track: core
    knowledge_areas: [AL]
    prerequisites: [CS1201, MA1101]

  - id: CS2102
    title: Computer Architecture
    semester: 3
    credits: 4
    track: core
    knowledge_areas: [AR]
    prerequisites: [CS1202]

  - id: MA2101
    title: Probability & Statistics for CS
    semester: 3
    credits: 3
    track: core
    knowledge_areas: [MSF]
    prerequisites: [MA1102]

  - id: CS2103
    title: Software Engineering
    semester: 3
    credits: 4
    track: core
    knowledge_areas: [SE, SEP]
    prerequisites: [CS1203]

  - id: CS2201
    title: Operating Systems
    semester: 4
    credits: 4
    track: core
    knowledge_areas: [OS]
    prerequisites: [CS2102, CS1202]

  - id: CS2202
    title: Data Management & Databases
    semester: 4
    credits: 4
    track: core
    knowledge_areas: [DM]
    prerequisites: [CS1201]

  - id: CS2203
    title: Theory of Computation
    semester: 4
    credits: 3
    track: core
    knowledge_areas: [AL]
    prerequisites: [MA1101]

  - id: CS2204
    title: HCI & Visual Computing
    semester: 4
    credits: 3
    track: core
    knowledge_areas: [HCI, GIT]
    prerequisites: [CS1203]

  # ── Year 3 ──────────────────────────────────────────────────────────
  - id: CS3101
    title: Computer Networks
    semester: 5
    credits: 4
    track: core
    knowledge_areas: [NC]
    prerequisites: [CS2201]

  - id: CS3102
    title: Machine Learning
    semester: 5
    credits: 4
    track: core
    knowledge_areas: [AI, MSF]
    prerequisites: [MA1201, MA2101, CS1201]

  - id: CS3103
    title: Programming Languages
    semester: 5
    credits: 3
    track: core
    knowledge_areas: [FPL]
    prerequisites: [CS1202, CS2203]

  - id: CS3104
    title: Security Fundamentals
    semester: 5
    credits: 3
