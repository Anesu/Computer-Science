  # ── Track: Systems ──────────────────────────────────────────────────
  - id: SYS-COMP
    title: Compilers
    semester: 6
    credits: 3
    track: systems
    knowledge_areas: [FPL, SF]
    prerequisites: [CS3103]

  - id: SYS-ADV
