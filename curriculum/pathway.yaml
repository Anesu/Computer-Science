  # ── Track: Security ─────────────────────────────────────────────────
  - id: SEC-CRYPTO
    title: Applied Cryptography
    semester: 6
    credits: 3
    track: security
    knowledge_areas: [SEC, MSF]
    prerequisites: [CS3104, MA1101]

  - id: SEC-SSD
    title: Secure Software Development
    semester: 6
    credits: 3
    track: security
    knowledge_areas: [SEC, SE]
    prerequisites: [CS3104, CS2103]

  - id: SEC-NET
