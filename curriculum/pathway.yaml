    prerequisites: [CS2201]

  - id: CS3201
    title: Parallel & Distributed Computing
    semester: 6
    credits: 4
    track: core
    knowledge_areas: [PDC]
    prerequisites: [CS3101, CS2201]

  - id: CS3202
    title: LLM Application Engineering
    semester: 6
    credits: 3
    track: core
    knowledge_areas: [AI, SPD, SE]
    prerequisites: [CS3102, CS2103]

  - id: CS3203
    title: Large-Scale Software & DevOps
    semester: 6
    credits: 3
    track: core
    knowledge_areas: [SE, SPD]
    prerequisites: [CS2103, CS2202]

  # ── Year 4 ──────────────────────────────────────────────────────────
  - id: CS4101
